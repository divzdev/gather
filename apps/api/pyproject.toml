[project]
name = "conference-api"
version = "0.1.0"
description = "Speaker and session management API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    # Correct monotonic UUIDv7 per RFC 9562 is easy to get subtly wrong by hand;
    # this is a small Rust-backed implementation that handles same-millisecond
    # ordering. Postgres 16 has no native uuidv7().
    "uuid-utils>=0.10",
    # XLSX is a zip of XML schemas; hand-rolling a writer to save one dependency
    # is how you ship a file Excel refuses to open. Write-only, no runtime cost
    # on any path that does not export.
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "freezegun>=1.5",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit (security)
    "BLE",      # no blind `except Exception` outside deliberate probes
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: hardcoded test credentials are fine.
# F811: importing a fixture shadows the parameter that receives it — the
# standard way pytest fixtures are shared between test modules.
"tests/*" = ["S105", "S106", "F811"]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]
warn_unreachable = true
# Alembic migrations are generated and not worth strict-typing.
exclude = "alembic/versions/"

[[tool.mypy.overrides]]
module = ["uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the engine fixture is session-scoped, and a
# per-test loop would close connections out from under it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
