[project]
name = "conference-api"
version = "0.1.0"
description = "Speaker and session management API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "python-multipart>=0.0.20",
    # Imported directly (core/mail.py, core/storage.py) — declared so an
    # upstream dependency shuffle can never take it out from under us.
    "anyio>=4",
    # Correct monotonic UUIDv7 per RFC 9562 is easy to get subtly wrong by hand;
    # this is a small Rust-backed implementation that handles same-millisecond
    # ordering. Postgres 16 has no native uuidv7().
    "uuid-utils>=0.10",
    # XLSX is a zip of XML schemas; hand-rolling a writer to save one dependency
    # is how you ship a file Excel refuses to open. Write-only, no runtime cost
    # on any path that does not export.
    "openpyxl>=3.1",
    # Organisers paste embed HTML into portal pages, so that HTML is untrusted
    # input rendered to other people. Sanitising it is exactly the "don't roll
    # your own" case: nh3 is the maintained Rust (ammonia) successor to bleach,
    # allowlist-based, and runs on write only.
    "nh3>=0.2.18",
    # Third-party API credentials are stored at rest, so they are encrypted at
    # rest. The security baseline names this library specifically; rolling a
    # cipher by hand is the one thing it forbids outright.
    "cryptography>=44.0",
    # GitHub OAuth, reached only from features/auth/github.py. Already present
    # for the test client; promoted to a runtime dependency because the token
    # exchange happens inside a request and must not block the event loop.
    "httpx>=0.28",
    # SES, reached only from core/mail.py. AWS publishes no first-party async
    # client, so the sync one runs in a worker thread rather than pulling in a
    # second HTTP stack to keep it off the event loop.
    "boto3>=1.35",
    # Error reporting, reached only from core/observability.py. Inert without a
    # DSN, so it costs an import and nothing else on a credential-free machine.
    # Its FastAPI, SQLAlchemy and asyncio integrations auto-enable off libraries
    # already here, which is why no extras are pinned.
    "sentry-sdk>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
    "freezegun>=1.5",
    "types-openpyxl>=3.1.5.20260807",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async correctness
    "S",        # bandit (security)
    "BLE",      # no blind `except Exception` outside deliberate probes
]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: hardcoded test credentials are fine.
# F811: importing a fixture shadows the parameter that receives it — the
# standard way pytest fixtures are shared between test modules.
"tests/*" = ["S105", "S106", "F811"]
"alembic/versions/*" = ["E501"]
# E501: this module is a JavaScript program inside a string. Its long lines are
# CSS declarations, and folding them to a Python line-length rule makes the
# JavaScript harder to read, not the Python easier.
"src/app/features/publishing/embed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]
warn_unreachable = true
# Alembic migrations are generated and not worth strict-typing.
exclude = "alembic/versions/"

[[tool.mypy.overrides]]
module = ["uuid_utils.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the engine fixture is session-scoped, and a
# per-test loop would close connections out from under it.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
